name: Install privacy-safe GA4 event tracking

on:
  push:
    branches:
      - analytics/conversion-events

permissions:
  contents: write

jobs:
  install-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged branch
        uses: actions/checkout@v4
        with:
          ref: analytics/conversion-events
          fetch-depth: 0

      - name: Add privacy-safe event tracking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js = r'''(function () {
            'use strict';

            function sendEvent(eventName, extraParams) {
              if (typeof window.gtag !== 'function') return;
              var params = Object.assign({
                page_path: window.location.pathname || '/'
              }, extraParams || {});
              window.gtag('event', eventName, params);
            }

            // Count a completed website contact request only after the form provider
            // redirects back to the site's existing success state. No form values are read.
            try {
              var query = new URLSearchParams(window.location.search);
              if (query.get('contact') === 'success') {
                var leadKey = 'calibrae_ga4_generate_lead_' + (window.location.pathname || '/');
                if (!window.sessionStorage.getItem(leadKey)) {
                  sendEvent('generate_lead', { lead_source: 'website_contact_form' });
                  window.sessionStorage.setItem(leadKey, '1');
                }
              }
            } catch (e) {
              // If session storage is unavailable, do not collect anything extra.
            }

            document.addEventListener('click', function (event) {
              var anchor = event.target && event.target.closest ? event.target.closest('a') : null;
              if (!anchor) return;

              var href = (anchor.getAttribute('href') || '').trim();
              var text = (anchor.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();

              if (/^tel:/i.test(href)) {
                sendEvent('call_click');
                return;
              }

              if (/^sms:/i.test(href)) {
                sendEvent('text_click');
                return;
              }

              if (/myaestheticspro\.com|aespro\.biz/i.test(href) || /\bbook(?: now| appointment)?\b/i.test(text)) {
                sendEvent('book_now_click');
                return;
              }

              if (href.indexOf('#contact-page') !== -1 || text.indexOf('request consultation') !== -1) {
                sendEvent('consultation_cta_click');
              }
            }, true);
          }());
          '''

          Path('analytics-events.js').write_text(js, encoding='utf-8')

          files = [
              Path('index.html'),
              Path('botox-winchester-va.html'),
              Path('sculptra-winchester-va.html'),
              Path('danielle-wiley-pa-c.html'),
          ]
          include = '<script defer src="/analytics-events.js"></script>'

          for path in files:
              data = path.read_bytes()
              if include.encode() in data:
                  print(f'Analytics event script already linked in {path}')
                  continue

              newline = b'\r\n' if b'\r\n' in data else b'\n'
              needle = b'</head>'
              if needle not in data:
                  raise RuntimeError(f'Missing </head> in {path}')
              insertion = b'  ' + include.encode() + newline
              updated = data.replace(needle, insertion + needle, 1)
              path.write_bytes(updated)
              print(f'Linked analytics-events.js in {path}')
          PY

      - name: Verify only intended files changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          for f in $changed; do
            case "$f" in
              analytics-events.js|index.html|botox-winchester-va.html|sculptra-winchester-va.html|danielle-wiley-pa-c.html) ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done

          test -f analytics-events.js
          for name in call_click text_click book_now_click consultation_cta_click generate_lead; do
            grep -q "$name" analytics-events.js || { echo "Missing event $name" >&2; exit 1; }
          done
          if grep -Eqi 'first[ _-]?name|last[ _-]?name|phone[ _-]?number|email_address|formdata|\.value' analytics-events.js; then
            echo "Potential patient-data access detected in analytics-events.js" >&2
            exit 1
          fi
          for f in index.html botox-winchester-va.html sculptra-winchester-va.html danielle-wiley-pa-c.html; do
            count="$(grep -c 'analytics-events.js' "$f")"
            if [ "$count" -ne 1 ]; then
              echo "Expected one analytics-events.js include in $f, found $count" >&2
              exit 1
            fi
          done

      - name: Remove one-time workflow and commit staged changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/install-analytics-events.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics-events.js index.html botox-winchester-va.html sculptra-winchester-va.html danielle-wiley-pa-c.html .github/workflows/install-analytics-events.yml
          git commit -m "feat: add privacy-safe GA4 conversion events"
          git push origin HEAD:analytics/conversion-events
