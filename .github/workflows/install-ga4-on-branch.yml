name: Install GA4 on staged branch

on:
  push:
    branches:
      - seo/ga4-install

permissions:
  contents: write

jobs:
  install-ga4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged branch
        uses: actions/checkout@v4
        with:
          ref: seo/ga4-install
          fetch-depth: 0

      - name: Insert GA4 tag without changing page content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          measurement_id = "G-YCFMR28HW1"
          files = [
              Path("index.html"),
              Path("botox-winchester-va.html"),
              Path("sculptra-winchester-va.html"),
              Path("danielle-wiley-pa-c.html"),
          ]

          for path in files:
              data = path.read_bytes()
              if measurement_id.encode() in data:
                  print(f"GA4 already present in {path}")
                  continue

              newline = b"\r\n" if b"\r\n" in data else b"\n"
              lines = [
                  b"  <!-- Google tag (gtag.js) -->",
                  b"  <script async src=\"https://www.googletagmanager.com/gtag/js?id=G-YCFMR28HW1\"></script>",
                  b"  <script>",
                  b"    window.dataLayer = window.dataLayer || [];",
                  b"    function gtag(){dataLayer.push(arguments);}",
                  b"    gtag('js', new Date());",
                  b"",
                  b"    gtag('config', 'G-YCFMR28HW1');",
                  b"  </script>",
              ]
              snippet = newline.join(lines)
              needle = b"<head>"
              if needle not in data:
                  raise RuntimeError(f"Missing <head> in {path}")
              updated = data.replace(needle, needle + newline + snippet, 1)
              path.write_bytes(updated)
              print(f"Inserted GA4 into {path}")
          PY

      - name: Verify only intended HTML files changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          for f in $changed; do
            case "$f" in
              index.html|botox-winchester-va.html|sculptra-winchester-va.html|danielle-wiley-pa-c.html) ;;
              *) echo "Unexpected changed file: $f" >&2; exit 1 ;;
            esac
          done
          for f in index.html botox-winchester-va.html sculptra-winchester-va.html danielle-wiley-pa-c.html; do
            count="$(grep -c "G-YCFMR28HW1" "$f")"
            if [ "$count" -ne 2 ]; then
              echo "Expected exactly two GA4 ID references in $f, found $count" >&2
              exit 1
            fi
          done

      - name: Remove one-time workflow and commit staged changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/install-ga4-on-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html botox-winchester-va.html sculptra-winchester-va.html danielle-wiley-pa-c.html .github/workflows/install-ga4-on-branch.yml
          git commit -m "feat: install GA4 measurement tag"
          git push origin HEAD:seo/ga4-install
