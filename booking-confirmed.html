  <meta charset="UTF-8" />

  <title>Appointment Confirmed | Calibrae Institute</title>

  <style>
    :root {
      --bg: #464646;
      --bg-deep: #2f2f2f;
      --text: #f7f7f5;
      --muted: #d7d7d2;
      --line: rgba(255,255,255,0.16);
      --panel: rgba(255,255,255,0.06);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: "Montserrat", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 82% 16%, rgba(255,255,255,0.10), transparent 28%),
        radial-gradient(circle at 12% 78%, rgba(255,255,255,0.05), transparent 24%),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-deep) 100%);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(720px, 100%);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      color: var(--text);
      text-decoration: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      font-size: 1.15rem;
      font-weight: 500;
    }

    .brand-name {
      font-size: 1.35rem;
      font-weight: 300;
      letter-spacing: 0.30em;
      text-transform: uppercase;
    }

    .card {
      padding: clamp(38px, 7vw, 68px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.075), var(--panel));
      box-shadow: 0 26px 70px rgba(0,0,0,0.22);
      backdrop-filter: blur(10px);
    }

    .check {
      width: 58px;
      height: 58px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 50%;
      font-size: 1.55rem;
      font-weight: 400;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.15rem, 7vw, 3.8rem);
      line-height: 1.02;
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    p {
      max-width: 560px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 50px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--text);
      background: var(--text);
      color: #202020;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.025em;
    }

    .button.secondary {
      border-color: var(--line);
      background: transparent;
      color: var(--text);
    }

    .note {
      margin-top: 24px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.62);
    }

    @media (max-width: 560px) {
      body { padding: 20px 14px; }
      .brand-name { font-size: 1.05rem; letter-spacing: 0.24em; }
      .card { border-radius: 22px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Calibrae Institute home">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-name">Calibrae</span>
    </a>

    <section class="card" aria-labelledby="confirmation-title">
      <div class="check" aria-hidden="true">✓</div>
      <p class="eyebrow">Appointment confirmed</p>
      <h1 id="confirmation-title">You're all set.</h1>
      <p>Your online booking has been completed. We look forward to seeing you at Calibrae Institute.</p>

      <div class="actions">
        <a class="button" href="/">Return to Calibrae</a>
        <a class="button secondary" href="tel:7035931948">Call or text us</a>
      </div>

      <p class="note">3343 Valley Pike, Suite 400 · Winchester, VA</p>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var markedComplete =
        params.get('booking') === 'completed' &&
        params.get('source') === 'aestheticspro';

      var fromAestheticsPro = false;
      try {
        if (document.referrer) {
          var referrer = new URL(document.referrer);
          fromAestheticsPro = referrer.hostname === 'web2.myaestheticspro.com' ||
            referrer.hostname.endsWith('.myaestheticspro.com');
        }
      } catch (error) {
        fromAestheticsPro = false;
      }

      // Fire only when the page is reached through the AestheticsPro completion flow.
      // The query marker is preferred; the referrer check is a fallback if AestheticsPro
      // redirects to the clean URL without preserving query parameters.
      if (!markedComplete && !fromAestheticsPro) return;

      var firedKey = 'calibrae_online_appointment_booked_fired';

      try {
        if (sessionStorage.getItem(firedKey) === '1') return;
        sessionStorage.setItem(firedKey, '1');
      } catch (error) {
        // If storage is unavailable, history cleanup below still prevents most refresh repeats.
      }

      gtag('event', 'conversion', {
        'send_to': 'AW-18178251952/tS0qCKr9vIEdELC5iNxD'
      });

      // Remove the marker from the visible URL after queueing the conversion so a refresh
      // does not look like a new confirmed-booking redirect.
      if (markedComplete && window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, '/booking-confirmed');
      }
    }());
  </script>
</body>
</html>
